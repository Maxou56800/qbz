[package]
name = "qbz-net-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "User-configured HTTP/HTTPS/SOCKS proxy: config type and a reqwest ClientBuilder helper"

[features]
# Adds apply_blocking()/apply_current_blocking() for the one call site
# (qbz-media-controls) that needs reqwest::blocking instead of the async
# client every other consumer of this crate uses.
blocking = ["reqwest/blocking"]
# Adds connect_tunnel(): a raw, proxy-tunneled AsyncRead+AsyncWrite stream for
# the one consumer (qconnect-transport-ws) that does not use reqwest at all
# and needs to hand its own TCP stream to tokio-tungstenite. Everyone else
# only ever goes through reqwest's own proxy support, so this stays optional.
tunnel = ["dep:tokio-socks", "dep:base64"]

[dependencies]
reqwest = { workspace = true }
# Percent-encodes proxy username/password correctly when building the proxy
# URL reqwest parses (Url::set_username/set_password), instead of hand-rolled
# string formatting that a `:` or `@` in either field would break.
url = "2"
thiserror = { workspace = true }
tokio = { workspace = true }
# SOCKS4/SOCKS5 tunneling for connect_tunnel(). Domain targets are passed
# through as-is (IntoTargetAddr), which is what makes the proxy resolve DNS
# instead of the local resolver — see the module docs on DNS leaks.
tokio-socks = { version = "0.5", optional = true }
# Proxy-Authorization: Basic header for the HTTP CONNECT tunnel, only.
base64 = { workspace = true, optional = true }

[dev-dependencies]
# Building a real reqwest::Client needs a process-wide rustls CryptoProvider
# installed once (the `rustls-no-provider` TLS backend does not pick a
# default for you). The real app does this at startup; the `test()` tests
# below build a real client, so they install it themselves.
rustls = { version = "0.23", features = ["aws_lc_rs"] }
