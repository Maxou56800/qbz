[package]
name = "qbz-net-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "User-configured HTTP/HTTPS/SOCKS proxy: config type and a reqwest ClientBuilder helper"

[features]
# Adds apply_blocking()/apply_current_blocking() for the one call site
# (qbz-media-controls) that needs reqwest::blocking instead of the async
# client every other consumer of this crate uses.
blocking = ["reqwest/blocking"]
# Adds connect_tunnel(): a raw, proxy-tunneled AsyncRead+AsyncWrite stream for
# the one consumer (qconnect-transport-ws) that does not use reqwest at all
# and needs to hand its own TCP stream to tokio-tungstenite. Everyone else
# only ever goes through reqwest's own proxy support, so this stays optional.
tunnel = ["dep:tokio-socks", "dep:base64"]

[dependencies]
reqwest = { workspace = true }
# Percent-encodes proxy username/password correctly when building the proxy
# URL reqwest parses (Url::set_username/set_password), instead of hand-rolled
# string formatting that a `:` or `@` in either field would break.
url = "2"
thiserror = { workspace = true }
tokio = { workspace = true }
# SOCKS5 tunneling for connect_tunnel(). Domain targets are passed
# through as-is (IntoTargetAddr), which is what makes the proxy resolve DNS
# instead of the local resolver — see the module docs on DNS leaks.
tokio-socks = { version = "0.5", optional = true }
# Proxy-Authorization: Basic header for the HTTP CONNECT tunnel, only.
base64 = { workspace = true, optional = true }
# insecure_tls.rs: a custom rustls ClientConfig for ProxyConfig::insecure_tls
# (bypasses TLS verification for the https:// proxy's own handshake only —
# see that module's docs). Same version/provider as qbz-app/qbz-qobuz so the
# process-wide CryptoProvider `ensure_crypto_provider()` installs is the one
# this crate reads back via `CryptoProvider::get_default()`.
rustls = { version = "0.23", features = ["aws_lc_rs"] }
# The delegate half of ScopedInsecureVerifier: the same platform-native
# verifier reqwest's own "rustls-no-provider" backend uses, so verifying
# every non-proxy hostname behaves identically to the unmodified path.
rustls-platform-verifier = "0.7"

[dev-dependencies]
# insecure_tls.rs's own test: a real TLS server presenting a self-signed
# cert, to prove ScopedInsecureVerifier's bypass over an actual handshake
# rather than just asserting the ClientConfig builds.
tokio-rustls = "0.26"
