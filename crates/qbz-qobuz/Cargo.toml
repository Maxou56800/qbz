[package]
name = "qbz-qobuz"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qobuz API client for QBZ"

[dependencies]
qbz-models = { path = "../qbz-models" }
qbz-cmaf = { path = "../qbz-cmaf" }
qbz-net-proxy = { path = "../qbz-net-proxy" }

# Async
tokio = { workspace = true }
futures-util = { workspace = true }

# HTTP
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto (for Qobuz auth)
md-5 = { workspace = true }
base64 = { workspace = true }
zeroize = "1"

# Time
chrono = { workspace = true }

# Filesystem (bundle-token cache location, atomic replacement of it)
dirs = "6"
tempfile = "3"

# Regex
regex = { workspace = true }

# Logging
log = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# Used only by examples/lyrics_probe.rs (read-only live probe of the lyrics
# endpoint): loads the saved OAuth token / credentials for login.
qbz-credentials = { path = "../qbz-credentials" }
# The offline-gate tests build a reqwest client, which panics with
# "No provider set" until a process-level rustls CryptoProvider exists. The app
# installs one at startup; a test binary has to do it itself.
rustls = { version = "0.23", features = ["aws_lc_rs"] }
